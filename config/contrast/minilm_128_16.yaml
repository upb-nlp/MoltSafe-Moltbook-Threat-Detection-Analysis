random_seed: 42

embedding:
  model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  fp16: true
  batch_size: 64
  max_seq_length: 128
  mask_emails: true
  email_placeholder: "@"
  chunking: true
  chunk_tokens: 128
  chunk_overlap: 16

faiss:
  top_k: 5

search:
  mode: "contrast"
  malicious_severities: ["3", "4", "5"]
  benign_severities: ["0"]
